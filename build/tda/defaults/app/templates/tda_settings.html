<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migasfree TDA — Settings</title>
    <link rel="stylesheet" href="/manager/static/css/branding.css">
    <link rel="stylesheet" href="/tda/static/css/tda-settings.css">
</head>

<body>
    <div class="settings-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="/manager/static/img/logo.svg" alt="Migasfree logo">
                <div>
                    <h1>migasfree</h1>
                    <span>TDA Settings</span>
                </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:0.4rem;">
                <a href="/tda/" id="sidebarDashboardLink" class="nav-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3" />
                        <circle cx="6" cy="12" r="3" />
                        <circle cx="18" cy="19" r="3" />
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                    </svg>
                    Dashboard
                </a>
                <a href="/tda/settings" class="nav-link active">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                    Settings
                </a>
            </div>

            <!-- User profile -->
            <div id="userProfileSection"
                style="display:none;margin-top:auto;padding:0.65rem 0.8rem;background:rgba(255,255,255,0.65);border:1px solid var(--glass-border);border-radius:10px;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
                <div style="display:flex;align-items:center;gap:9px;overflow:hidden;">
                    <div style="width:26px;height:26px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:700;flex-shrink:0;"
                        id="userAvatar">U</div>
                    <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                        <div id="userName"
                            style="font-weight:700;font-size:0.8rem;color:var(--text-main);line-height:1.2;">User</div>
                        <div id="userRole" style="font-size:0.65rem;color:var(--brand-secondary);">Staff</div>
                    </div>
                </div>
                <button onclick="logout()" title="Logout"
                    style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);cursor:pointer;color:#dc2626;padding:4px;display:flex;border-radius:6px;transition:all 0.2s ease;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content">

            <!-- Map designer form (Always visible) -->
            <div class="lens-form" id="lensFormCard">
                <div
                    style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass-border);padding-bottom:0.6rem;gap:12px;flex-wrap:wrap;">
                    <div class="map-selector-group" style="flex:1;max-width:380px;">
                        <label for="currentMapSelect" class="map-selector-label">Active Map:</label>
                        <select id="currentMapSelect" class="map-select" onchange="onMapSelectChange(this.value)">
                            <option value="">Loading maps…</option>
                        </select>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                        <button type="button" class="btn-icon" id="btnViewDashboard"
                            onclick="viewCurrentMapInDashboard()" title="View in Dashboard">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                        <button type="button" class="btn-icon" id="btnRecalcMap" onclick="recalcCurrentMap()"
                            title="Recalculate this map">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                            </svg>
                        </button>
                        <button type="button" class="btn-icon danger" id="btnDeleteMap" onclick="deleteCurrentMap()"
                            style="display:none;" title="Delete this custom map">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6" />
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                        <button type="button" class="btn-icon primary" onclick="newLens()" title="Create a new map">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Form Tabs Header -->
                <div class="form-tabs">
                    <button type="button" class="form-tab-btn active" onclick="switchFormTab('tab-general', this)">General</button>
                    <button type="button" class="form-tab-btn" onclick="switchFormTab('tab-scopes', this)">Scope</button>
                    <button type="button" class="form-tab-btn" onclick="switchFormTab('tab-dimensions', this)">Dimensions</button>
                    <button type="button" class="form-tab-btn" onclick="switchFormTab('tab-advanced', this)">Advanced</button>
                </div>

                <!-- TAB 1: General -->
                <div id="tab-general" class="form-tab-panel active">
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="lensName">Name</label>
                            <input type="text" id="lensName" class="form-input" placeholder="my_map" spellcheck="false">
                        </div>
                        <div class="form-field">
                            <label for="lensLabel">Display Label</label>
                            <input type="text" id="lensLabel" class="form-input" placeholder="My Map">
                        </div>
                        <div class="form-field full">
                            <label for="lensDesc">Description</label>
                            <textarea id="lensDesc" class="form-textarea" placeholder="Map description"></textarea>
                        </div>
                        <div class="form-field full">
                            <label class="check-label" style="font-weight:600;font-size:0.8rem;">
                                <input type="checkbox" id="lensScheduled" checked>
                                <span>scheduled run (cron)</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: Scopes -->
                <div id="tab-scopes" class="form-tab-panel">
                    <div class="section">
                        <div>
                            <div class="chip-header">
                                <div class="section-label">Scopes</div>
                            </div>
                            <div class="chip-grid" id="formScopeGrid">
                                <span class="chip-empty">No scopes loaded</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: Dimensions -->
                <div id="tab-dimensions" class="form-tab-panel">
                    <div class="section">
                        <!-- Attribute types -->
                        <div>
                            <div class="chip-header">
                                <div class="section-label">Attribute Types</div>
                            </div>
                            <div class="chip-grid" id="formPrefixGrid">
                                <span class="chip-empty">No attribute types loaded</span>
                            </div>
                        </div>

                        <!-- Metrics -->
                        <div>
                            <div class="chip-header">
                                <div class="section-label">Numerical Metrics</div>
                            </div>
                            <div class="chip-grid" id="formMetricGrid">
                                <span class="chip-empty">No metrics loaded</span>
                            </div>
                        </div>

                        <!-- Metrics History Interval -->
                        <div style="margin-top: 0.25rem;">
                            <div class="chip-header">
                                <div class="section-label">Metrics History (Days)</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:12px;margin-top:0.35rem;">
                                <input type="number" id="lensMetricsIntervalDays" class="form-input" min="1" max="3650"
                                    step="1" placeholder="365" style="max-width:180px;">
                            </div>
                        </div>
                    </div>

                    <!-- Default Color Scheme -->
                    <div class="section">
                        <div class="form-grid">
                            <div class="form-field full">
                                <label for="lensColorSelect">Color Scheme</label>
                                <select id="lensColorSelect" class="form-select">
                                    <option value="">Loading…</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="matrix-estimate" id="matrixEstimate">
                        <span class="chip-loading">Estimating matrix size…</span>
                    </div>
                </div>

                <!-- TAB 4: Advanced -->
                <div id="tab-advanced" class="form-tab-panel">
                    <!-- PROJECTION: filter function -->
                    <div class="section">
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="lensType">Projection Method</label>
                                <select id="lensType" class="form-select" onchange="updateLensFormVisibility()">
                                    <option value="multi_lens">Multi-Lens (PCA + Jaccard)</option>
                                    <option value="pca">PCA</option>
                                    <option value="mds_jaccard">Jaccard + MDS</option>
                                    <option value="identity">Identity</option>
                                </select>
                            </div>
                            <div class="form-field" id="lensComponentsField" style="display:none;">
                                <label for="lensComponents">PCA Components</label>
                                <select id="lensComponents" class="form-select">
                                    <option value="2">2 Components</option>
                                    <option value="1">1 Component</option>
                                </select>
                            </div>
                            <div class="form-field" id="lensMatrixField" style="display:none;">
                                <label for="lensMatrixSource">Binary Matrix Source</label>
                                <select id="lensMatrixSource" class="form-select">
                                    <option value="attributes">Attributes</option>
                                    <option value="packages">Packages</option>
                                </select>
                            </div>
                            <div class="form-field" id="lensMetric1Field" style="display:none;">
                                <label for="lensMetric1">Primary Metric</label>
                                <select id="lensMetric1" class="form-select"></select>
                            </div>
                            <div class="form-field" id="lensMetric2Field" style="display:none;">
                                <label for="lensMetric2">Secondary Metric</label>
                                <select id="lensMetric2" class="form-select"></select>
                            </div>
                        </div>
                    </div>

                    <!-- COVER: overlapping intervals/cubes -->
                    <div class="section">
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="coverType">Cover Type</label>
                                <select id="coverType" class="form-select">
                                    <option value="cubical">Cubical</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label for="coverNCubes">Number of intervals</label>
                                <input type="number" id="coverNCubes" class="form-input" min="1" step="1"
                                    placeholder="Adaptive (e.g. 10)">
                            </div>
                            <div class="form-field">
                                <label for="coverOverlap">Overlap fraction</label>
                                <input type="number" id="coverOverlap" class="form-input" min="0" max="0.99" step="0.05"
                                    placeholder="0.35">
                            </div>
                        </div>
                    </div>

                    <!-- CLUSTERING & LAYOUT: partition within each cover element -->
                    <div class="section">
                        <div class="form-field full">
                            <label class="check-label">
                                <input type="checkbox" id="clusteringScaling" checked>
                                Standardize / Scale features
                            </label>
                        </div>
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="clusteringType">Clustering Method</label>
                                <select id="clusteringType" class="form-select" onchange="updateClusteringVisibility()">
                                    <option value="dbscan">DBSCAN</option>
                                    <option value="kmeans">K-Means</option>
                                    <option value="agglomerative">Agglomerative</option>
                                    <option value="skip">Skip</option>
                                </select>
                            </div>
                            <div class="form-field" id="clusteringNClustersField" style="display:none;">
                                <label for="clusteringNClusters">Number of clusters</label>
                                <input type="number" id="clusteringNClusters" class="form-input" min="2" step="1"
                                    placeholder="2">
                            </div>
                            <div class="form-field" id="clusteringEpsField">
                                <label for="clusteringEps">Epsilon</label>
                                <input type="number" id="clusteringEps" class="form-input" min="0" step="0.05"
                                    placeholder="adaptive">
                            </div>
                            <div class="form-field" id="clusteringMinSamplesField">
                                <label for="clusteringMinSamples">Min Samples</label>
                                <input type="number" id="clusteringMinSamples" class="form-input" min="1" step="1"
                                    placeholder="adaptive">
                            </div>
                            <div class="form-field">
                                <label for="drawIterations">Layout Iterations</label>
                                <input type="number" id="drawIterations" class="form-input" min="1" step="1"
                                    placeholder="100">
                            </div>
                            <div class="form-field">
                                <label for="drawSeed">Random Seed</label>
                                <input type="number" id="drawSeed" class="form-input" min="0" step="1"
                                    placeholder="random">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions footer -->
                <div class="form-actions">
                    <button class="btn-save" style="height:auto;padding:0.55rem 1.4rem;" onclick="saveLens()">Save
                        Map</button>
                </div>
            </div>

            <!-- Status banner -->
            <div class="status-banner" id="statusBanner">
                <svg id="statusIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
                <span id="statusText"></span>
            </div>

        </main>
    </div>

    <!-- Login modal -->
    <div id="login-modal" style="display:none !important;">
        <div
            style="background:var(--bg-body,#fff);border:1px solid var(--glass-border);border-radius:14px;width:100%;max-width:360px;box-shadow:0 24px 48px rgba(0,0,0,0.25);overflow:hidden;padding:2rem;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;">
                <img src="/manager/static/img/logo.svg" alt="Migasfree" style="width:32px;height:32px;">
                <div>
                    <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#1e293b;">Staff Authentication</h3>
                    <span style="font-size:0.75rem;color:#64748b;">TDA Settings (Staff Area)</span>
                </div>
            </div>
            <form id="loginForm" onsubmit="submitLogin(event)" style="display:flex;flex-direction:column;gap:1rem;">
                <div id="loginError"
                    style="display:none;padding:0.6rem;background:#fee2e2;border:1px solid #f87171;border-radius:6px;font-size:0.78rem;color:#b91c1c;">
                </div>
                <div>
                    <label
                        style="display:block;font-size:0.72rem;font-weight:600;color:var(--text-main);margin-bottom:0.3rem;">Username</label>
                    <input type="text" id="loginUsername" required autocomplete="username"
                        style="width:100%;padding:0.6rem 0.8rem;border:1px solid var(--glass-border);border-radius:8px;font-family:inherit;font-size:0.85rem;outline:none;">
                </div>
                <div>
                    <label
                        style="display:block;font-size:0.72rem;font-weight:600;color:var(--text-main);margin-bottom:0.3rem;">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password"
                        style="width:100%;padding:0.6rem 0.8rem;border:1px solid var(--glass-border);border-radius:8px;font-family:inherit;font-size:0.85rem;outline:none;">
                </div>
                <button type="submit" id="loginSubmitBtn"
                    style="margin-top:0.5rem;padding:0.7rem;background:var(--brand-primary);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <span>Sign in</span>
                </button>
            </form>
        </div>
    </div>

    <script src="/tda/static/js/tda-settings.js"></script>
</body>

</html>
